<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProfitPad Clients</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    /* Categorical series slots (validated reference palette, fixed order) */
    :root {
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --series-3: #1baf7a;
      --series-4: #eda100;
      --series-5: #e87ba4;
      --series-6: #008300;
      --series-7: #4a3aa7;
      --series-8: #e34948;
      --series-other: #b4bac6;
    }

    /* Per-client legend for the stacked chart */
    .legend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px 28px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1.5px solid var(--border);
    }

    .legend-client {
      font-family: "Eastman Roman", Verdana, sans-serif;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .legend-client span:not(.client-link) {
      font-family: 'DM Mono', monospace;
      font-weight: 400;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .legend-client span.over {
      color: #e34948;
    }

    .legend-list {
      list-style: none;
      display: grid;
      gap: 5px;
    }

    .legend-list li {
      display: grid;
      grid-template-columns: 10px 1fr auto;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .legend-list li.zero {
      opacity: 0.45;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }

    .legend-list .val {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text);
    }

    .legend-list .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

  </style>
</head>

<body>
  <nav class="topnav">
    <a href="../"><img src="../assets/profitpad_logo.svg" alt="ProfitPad" /></a>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-label">Reports</div>
      <ul>
        <li>
          <a href="../overview/">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Client Overview
          </a>
        </li>
        <li>
          <a href="../dashboard/" class="active" aria-current="page">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3v18h18" />
              <path d="M7 16V11" />
              <path d="M12 16V7" />
              <path d="M17 16v-3" />
            </svg>
            Task Usage
          </a>
        </li>
      </ul>
    </aside>

    <main class="content">
      <div class="page">
        <div class="header">
          <div>
            <h1>Task usage</h1>
            <p>n8n tasks consumed by each client, broken down by workflow.</p>
          </div>
          <div class="filters" id="month-filter" role="group" aria-label="Month"></div>
        </div>

        <div id="root">
          <div class="state">
            <div class="spinner"></div>Loading task data…
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="../assets/common.js"></script>
  <script src="./dashboard.js"></script>
</body>

</html>
