<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProfitPad Clients</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    /* Categorical series slots (validated reference palette, fixed order) */
    :root {
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --series-3: #1baf7a;
      --series-4: #eda100;
      --series-5: #e87ba4;
      --series-6: #008300;
      --series-7: #4a3aa7;
      --series-8: #e34948;
      --series-other: #b4bac6;
    }

    /* ---------- Filters ---------- */
    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 4px;
    }

    .filters button {
      border: none;
      background: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 7px 12px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .filters button:hover {
      color: var(--text);
      background: var(--bg);
    }

    .filters button.active {
      background: var(--blue);
      color: #fff;
    }

    /* ---------- KPI tiles ---------- */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .kpi-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .kpi-value {
      font-family: "Eastman Roman", Verdana, sans-serif;
      font-size: 30px;
      font-weight: 600;
      color: var(--navy);
      margin-top: 6px;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
    }

    .kpi-note {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ---------- Report cards ---------- */
    .reports {
      display: grid;
      gap: 20px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
    }

    /* Per-client legend for the stacked chart */
    .legend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px 28px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1.5px solid var(--border);
    }

    .legend-client {
      font-family: "Eastman Roman", Verdana, sans-serif;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .legend-client span {
      font-family: 'DM Mono', monospace;
      font-weight: 400;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .legend-client span.over {
      color: #e34948;
    }

    .legend-list {
      list-style: none;
      display: grid;
      gap: 5px;
    }

    .legend-list li {
      display: grid;
      grid-template-columns: 10px 1fr auto;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .legend-list li.zero {
      opacity: 0.45;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }

    .legend-list .val {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text);
    }

    .legend-list .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---------- Table ---------- */
    .search-wrap {
      position: relative;
      width: 260px;
      max-width: 100%;
    }

    .search-wrap input {
      width: 100%;
      height: 38px;
      padding: 0 14px 0 36px;
      border: 1.5px solid var(--border-strong);
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s;
      color: var(--text);
    }

    .search-wrap input:focus {
      border-color: var(--blue);
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .table-scroll {
      overflow-x: auto;
      margin: 0 -22px -20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 11px 22px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      font-weight: 600;
      font-size: 12px;
      color: var(--text-secondary);
      background: #fafbfc;
      border-top: 1.5px solid var(--border);
      border-bottom: 1.5px solid var(--border);
      cursor: pointer;
      user-select: none;
    }

    th:hover {
      color: var(--blue);
    }

    th .arrow {
      color: var(--blue);
      margin-left: 4px;
    }

    td {
      border-bottom: 1px solid var(--border);
    }

    tbody tr:hover td {
      background: var(--blue-tint);
    }

    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    td.num {
      font-family: 'DM Mono', monospace;
    }

    .client-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--blue-tint);
      color: var(--blue);
      font-weight: 500;
      font-size: 12px;
    }

    .meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
      text-align: right;
    }

    .meta button {
      border: none;
      background: none;
      color: var(--blue);
      font: inherit;
      cursor: pointer;
      margin-left: 8px;
    }
  </style>
</head>

<body>
  <nav class="topnav">
    <a href="../"><img src="../assets/profitpad_logo.svg" alt="ProfitPad" /></a>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-label">Reports</div>
      <ul>
        <li>
          <a href="../dashboard/" class="active" aria-current="page">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3v18h18" />
              <path d="M7 16V11" />
              <path d="M12 16V7" />
              <path d="M17 16v-3" />
            </svg>
            Task Usage
          </a>
        </li>
      </ul>
    </aside>

    <main class="content">
      <div class="page">
        <div class="header">
          <div>
            <h1>Task usage</h1>
            <p>n8n tasks consumed by each client, broken down by workflow.</p>
          </div>
          <div class="filters" id="month-filter" role="group" aria-label="Month"></div>
        </div>

        <div id="root">
          <div class="state">
            <div class="spinner"></div>Loading task data…
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="./dashboard.js"></script>
</body>

</html>
