<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProfitPad Clients</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    /* Usage bar: tasks as a share of the monthly max */
    .usage {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .usage-bar {
      width: 90px;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      overflow: hidden;
    }

    .usage-bar span {
      display: block;
      height: 100%;
      border-radius: 3px;
      background: var(--blue);
    }

    .usage-pct {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .usage.over .usage-bar span {
      background: #e34948;
    }

    .usage.over .usage-pct {
      color: #e34948;
    }

    .muted {
      color: var(--text-muted);
    }

    td.strong {
      font-weight: 500;
      color: var(--navy);
    }

    .card h2 .client-link {
      font: inherit;
    }

    /* Pivot table: month column groups */
    .pivot th.group {
      text-align: center;
      border-left: 1.5px solid var(--border);
    }

    .pivot th.group-start,
    .pivot td.group-start {
      border-left: 1.5px solid var(--border);
    }

    .pivot .usage-bar {
      width: 60px;
    }

    .pivot tfoot td {
      font-weight: 600;
      color: var(--navy);
      background: #fafbfc;
      border-top: 1.5px solid var(--border);
    }

    /* These tables are not sortable */
    th,
    th:hover {
      cursor: default;
      color: var(--text-secondary);
    }
  </style>
</head>

<body>
  <nav class="topnav">
    <a href="../"><img src="../assets/profitpad_logo.svg" alt="ProfitPad" /></a>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-label">Reports</div>
      <ul>
        <li>
          <a href="../overview/" class="active" aria-current="page">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Client Overview
          </a>
        </li>
        <li>
          <a href="../dashboard/">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3v18h18" />
              <path d="M7 16V11" />
              <path d="M12 16V7" />
              <path d="M17 16v-3" />
            </svg>
            Task Usage
          </a>
        </li>
      </ul>
    </aside>

    <main class="content">
      <div class="page">
        <div class="header">
          <div>
            <h1>Client overview</h1>
            <p>Task usage against each client's monthly max, and server costs billed per month.</p>
          </div>
        </div>

        <div id="root">
          <div class="state">
            <div class="spinner"></div>Loading client data…
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/common.js"></script>
  <script src="./overview.js"></script>
</body>

</html>
